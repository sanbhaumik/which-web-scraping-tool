<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Web Data Tool Do You Need?</title>
<meta name="description" content="Answer four simple questions and find the right tool to get the data you need, with no technical knowledge required.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:     #faf8f5;
    --paper-2:   #f3efe9;
    --card:      #ffffff;
    --ink:       #2b2622;
    --ink-soft:  #6f665d;
    --ink-mute:  #a89e93;
    --line:      #ece7e0;
    --clay:      #c06e52;
    --clay-deep: #a85639;
    --clay-tint: #f7ece7;
    --sage:      #7d8a6f;
    --shadow-sm: 0 2px 8px rgba(43,38,34,0.05);
    --shadow-md: 0 8px 30px rgba(43,38,34,0.08);
    --shadow-lg: 0 20px 60px rgba(43,38,34,0.10);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-disp: 'Fraunces', Georgia, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    display: flex; flex-direction: column;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: opacity 0.2s ease !important; }
  }

  /* ── Header ─────────────────────────────────────────── */
  header { padding: 56px 24px 0; text-align: center; }
  .kicker {
    font-family: var(--font-body); font-weight: 500;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--clay); margin-bottom: 18px;
  }
  h1 {
    font-family: var(--font-disp);
    font-weight: 500;
    font-size: clamp(28px, 4.6vw, 42px);
    line-height: 1.12;
    letter-spacing: -0.015em;
    color: var(--ink);
    max-width: 600px; margin: 0 auto;
  }
  h1 em { font-style: italic; color: var(--clay); }
  .subhead {
    color: var(--ink-soft); font-size: 16px;
    margin: 20px auto 0; max-width: 440px;
  }

  /* ── Main ───────────────────────────────────────────── */
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 44px 20px 20px; }
  .card {
    width: 100%; max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 44px 40px;
    box-shadow: var(--shadow-lg);
  }

  /* Progress */
  .progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 36px; }
  .seg { height: 3px; width: 40px; border-radius: 100px; background: var(--line); transition: background 0.5s ease; }
  .seg.active { background: var(--clay); }
  .seg.done   { background: var(--sage); }

  /* Question */
  .step { animation: rise 0.5s cubic-bezier(0.22, 0.8, 0.3, 1); }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-num {
    font-family: var(--font-body); font-weight: 500;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 14px;
  }
  .q-text {
    font-family: var(--font-disp); font-weight: 500;
    font-size: 26px; line-height: 1.25; letter-spacing: -0.01em;
    color: var(--ink); margin-bottom: 8px;
  }
  .q-hint { color: var(--ink-soft); font-size: 15px; margin-bottom: 28px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    width: 100%; text-align: left; cursor: pointer;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px; padding: 17px 20px;
    color: var(--ink); font-family: var(--font-body);
    font-size: 15.5px; font-weight: 500;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    transition: all 0.22s cubic-bezier(0.22, 0.8, 0.3, 1);
    box-shadow: var(--shadow-sm);
  }
  .option:hover, .option:focus-visible {
    border-color: var(--clay);
    background: var(--clay-tint);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
    outline: none;
  }
  .opt-main { display: flex; flex-direction: column; }
  .opt-sub { font-size: 13px; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }
  .arrow { color: var(--ink-mute); flex-shrink: 0; transition: transform 0.22s ease, color 0.22s ease; }
  .option:hover .arrow { color: var(--clay); transform: translateX(3px); }

  /* Result */
  .result { animation: rise 0.55s cubic-bezier(0.22, 0.8, 0.3, 1); text-align: center; }
  .result-eyebrow {
    font-family: var(--font-body); font-weight: 500;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute); margin-bottom: 12px;
  }
  .result-product {
    font-family: var(--font-disp); font-weight: 600;
    font-size: 34px; letter-spacing: -0.015em;
    color: var(--clay); margin-bottom: 14px;
  }
  .result-story {
    font-size: 16px; color: var(--ink); max-width: 420px;
    margin: 0 auto 22px; line-height: 1.6;
  }
  .result-story strong { color: var(--ink); font-weight: 600; }

  .example {
    text-align: left; background: var(--paper-2);
    border-radius: 14px; padding: 16px 18px;
    margin: 0 auto 26px; max-width: 440px;
    font-size: 14.5px; color: var(--ink-soft); line-height: 1.55;
  }
  .example b { color: var(--ink); font-weight: 600; }

  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-body); font-size: 15.5px; font-weight: 600;
    padding: 15px 30px; border-radius: 100px;
    text-decoration: none; border: none; cursor: pointer;
    color: #fff; background: var(--clay);
    box-shadow: 0 8px 24px rgba(192,110,82,0.28);
    transition: all 0.22s cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .cta-btn:hover { background: var(--clay-deep); transform: translateY(-1px); box-shadow: 0 12px 30px rgba(192,110,82,0.36); }

  .why {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; max-width: 440px; margin: 0 auto 24px;
    text-align: left; overflow: hidden;
  }
  .why summary {
    padding: 14px 18px; cursor: pointer; list-style: none;
    font-size: 14px; font-weight: 500; color: var(--ink-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .why summary::-webkit-details-marker { display: none; }
  .why summary::after { content: '+'; color: var(--ink-mute); font-size: 16px; }
  .why[open] summary::after { content: '–'; }
  .why-body { padding: 0 18px 16px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }

  .restart {
    background: none; border: none; color: var(--ink-mute);
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    cursor: pointer; margin-top: 22px; padding: 6px;
    transition: color 0.2s;
  }
  .restart:hover { color: var(--ink-soft); }

  /* Footer */
  footer { text-align: center; padding: 28px 20px 34px; font-size: 13px; color: var(--ink-mute); }
  footer a { color: var(--ink-soft); text-decoration: none; font-weight: 500; }
  footer a:hover { color: var(--ink); }
  .disclosure { font-size: 12px; margin-top: 7px; color: var(--ink-mute); }

  @media (max-width: 540px) {
    header { padding-top: 40px; }
    .card { padding: 34px 24px; }
    .q-text { font-size: 22px; }
    .result-product { font-size: 28px; }
  }
</style>
</head>
<body>

<header>
  <div class="kicker">A quick guide</div>
  <h1>You need data from the internet.<br><em>Which tool actually gets it?</em></h1>
  <p class="subhead">Four simple questions, no technical knowledge required. We'll match you to the right tool, and tell you honestly if you don't need to pay for anything yet.</p>
</header>

<main>
  <div class="card">
    <div class="progress" id="progress"></div>
    <div id="content"></div>
  </div>
</main>

<footer>
  <div>Matches you to the right <a href="https://brightdata.com" target="_blank" rel="noopener">Bright Data</a> tool for the job</div>
</footer>

<script>
const LINKS = {
  serp:   "https://brightdata.com/products/serp-api",
  unlock: "https://brightdata.com/products/web-unlocker",
  scrape: "https://brightdata.com/products/web-scraper",
  studio: "https://brightdata.com/products/web-scraper/studio",
  browser:"https://brightdata.com/ai/agent-browser",
  data:   "https://brightdata.com/products/datasets",
  proxy:  "https://brightdata.com/proxy-types"
};

const ARROW = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const TREE = {
  q1: {
    n:1, text:"What are you actually trying to get?",
    hint:"Think about the end result you want in your hands.",
    options:[
      {label:"What shows up when I search Google", sub:"rankings, shopping results, who's on top", next:"r_serp"},
      {label:"Information from actual web pages", sub:"prices, listings, reviews, profiles", next:"q2"},
      {label:"A ready-made pile of data", sub:"I'd rather not collect it myself", next:"r_data"},
      {label:"I'm building my own tool and need the plumbing", sub:"just reliable connections to build on", next:"r_proxy"}
    ]
  },
  q2: {
    n:2, text:"Do you have to click around to reach it?",
    hint:"Logging in, searching, filtering, or clicking through a few pages.",
    options:[
      {label:"Yes, I log in or click through steps", sub:"the information hides behind a few actions", next:"r_browser"},
      {label:"No, it's there when the page loads", sub:"I can see it straight away", next:"q3"}
    ]
  },
  q3: {
    n:3, text:"Is it a well-known site, or something niche?",
    hint:"Well-known meaning Amazon, Instagram, LinkedIn, the big ones.",
    options:[
      {label:"A well-known site, and I want a lot of it", sub:"Amazon, LinkedIn, Instagram, and the like", next:"r_scrape"},
      {label:"Somewhere niche, and I'll return to it often", sub:"a smaller site nobody's built a tool for", next:"r_studio"},
      {label:"Just one page, one time", sub:"a quick grab, not an ongoing thing", next:"q4"}
    ]
  },
  q4: {
    n:4, text:"Is the site putting up a fight?",
    hint:"Pop-ups asking 'are you a robot?', pages that won't load.",
    options:[
      {label:"Yes, it keeps blocking me", sub:"captchas, walls, odd errors", next:"r_unlock"},
      {label:"No, the page loads just fine", sub:"no blocks, no fuss", next:"r_none"}
    ]
  }
};

const RESULTS = {
  r_serp:{eyebrow:"Your match",product:"SERP API",
    story:"You want to see <strong>what search engines show</strong>. This tool hands you Google or Bing results as neat, organised data, from any country you choose.",
    example:"<b>For example:</b> A shop owner wants to know where their trainers rank on Google Shopping in the UK, Germany, and France, checked automatically every few hours, from inside each country.",
    whyNot:"The more advanced tools could do this too, but you'd be paying for far more than search results need. This one is built precisely for the job.",
    link:LINKS.serp,cta:"Explore SERP API"},
  r_unlock:{eyebrow:"Your match",product:"Web Unlocker",
    story:"You need <strong>one stubborn page</strong> that keeps blocking you. Web Unlocker gets past the 'are you a robot?' walls and returns the clean page.",
    example:"<b>For example:</b> You want the price from a competitor's product page, but it shows a captcha every time. Web Unlocker gets through and returns the page.",
    whyNot:"A full browser tool would also get in, but it's built for clicking through many pages. For a single page, this is the simpler, lower-cost choice.",
    link:LINKS.unlock,cta:"Explore Web Unlocker"},
  r_scrape:{eyebrow:"Your match",product:"Scraper API",
    story:"You want <strong>a lot of data from a well-known site</strong>. There's already a ready-made collector for it. You point, it returns clean data, and it's kept working when the site changes.",
    example:"<b>For example:</b> You track thousands of Amazon products: prices, who holds the buy box, how many sellers. A pre-built Amazon collector handles it, with no setup.",
    whyNot:"You could build your own, but every time the site changes, the fix is yours to make. The ready-made collector saves you that ongoing work.",
    link:LINKS.scrape,cta:"Explore Scraper API"},
  r_studio:{eyebrow:"Your match",product:"Scraper Studio",
    story:"Your site is <strong>niche, with no ready-made collector</strong>, but you'll use it repeatedly. Describe what you want in plain English, and the AI builds a collector for you. When the site changes and it breaks, you fix it with another sentence.",
    example:"<b>For example:</b> You want listings from a small regional property site. You describe the price, size, and location fields, and the AI builds a collector that keeps running as the site shifts.",
    whyNot:"A full browser could visit the site too, but if you simply want the same data pulled regularly, Studio costs less and maintains itself.",
    link:LINKS.studio,cta:"Explore Scraper Studio"},
  r_browser:{eyebrow:"Your match",product:"Agent Browser",
    story:"Your data <strong>hides behind clicks</strong>: a login, a search, a few pages deep. This tool browses like a person: it logs in, clicks, scrolls, and reaches what a simple grab never could.",
    example:"<b>For example:</b> A booking site only shows real prices after you choose dates, log in, and click through three screens. The tool does all of that on its own and returns the price.",
    whyNot:"This is the most capable, and the most costly per job, which is exactly why you only want it when the data genuinely sits behind clicking. Yours does.",
    link:LINKS.browser,cta:"Explore Agent Browser"},
  r_data:{eyebrow:"Your match",product:"Ready-Made Datasets",
    story:"You want <strong>the data, not the work</strong>. It's already been gathered and cleaned, so you buy the set and skip the collecting entirely.",
    example:"<b>For example:</b> You're training a model and need a year of product prices. Rather than collect it yourself, you buy a clean, ready dataset that's kept up to date.",
    whyNot:"If you need something very up-to-the-minute, or a source nobody has gathered yet, you'll want a collecting tool instead. For data that already exists, buying beats building.",
    link:LINKS.data,cta:"Browse Datasets"},
  r_proxy:{eyebrow:"Your match",product:"Proxy Network",
    story:"You're <strong>building your own tool</strong> and need the layer underneath: reliable connections from around the world, so sites treat you as a real, local visitor.",
    example:"<b>For example:</b> A developer has built their own collector and wants it to appear as though it's browsing from fifty different countries. The proxy network provides those connections to build on.",
    whyNot:"If you'd rather not build and maintain your own collector, the tools above already include this layer, so you'd get the connections and the collecting together.",
    link:LINKS.proxy,cta:"Explore Proxy Network"},
  r_none:{eyebrow:"Good news",product:"You're set for now",
    story:"If the page <strong>loads fine with no blocking</strong>, here's the honest answer: you may not need to pay for anything yet. Try the simple, free approach first.",
    example:"<b>What to do:</b> Fetch the page with a basic script or a free tool. The day it stops working (and on a real site, it eventually will), <b>Web Unlocker</b> is the most affordable next step.",
    whyNot:"Reaching for a paid browser or collector before you've hit a wall is the classic way to overspend. Start simple, and move up only when the site forces you to.",
    link:LINKS.unlock,cta:"See Web Unlocker (for later)"}
};

function renderProgress(n, done){
  const bar=document.getElementById('progress');
  bar.innerHTML='';
  for(let i=1;i<=4;i++){
    const s=document.createElement('div');
    s.className='seg';
    if(done||i<n) s.classList.add('done');
    else if(i===n) s.classList.add('active');
    bar.appendChild(s);
  }
}

function renderQuestion(key){
  const q=TREE[key];
  renderProgress(q.n,false);
  const el=document.getElementById('content');
  el.innerHTML='';
  const step=document.createElement('div');
  step.className='step';
  step.innerHTML=`<div class="q-num">Question ${q.n} of 4</div><div class="q-text">${q.text}</div><div class="q-hint">${q.hint}</div><div class="options" id="options"></div>`;
  el.appendChild(step);
  const opts=step.querySelector('#options');
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='option';
    b.innerHTML=`<span class="opt-main"><span>${o.label}</span><span class="opt-sub">${o.sub}</span></span>${ARROW}`;
    b.onclick=()=>o.next.startsWith('r_')?renderResult(o.next):renderQuestion(o.next);
    opts.appendChild(b);
  });
}

function renderResult(key){
  const r=RESULTS[key];
  renderProgress(4,true);
  const el=document.getElementById('content');
  el.innerHTML='';
  const res=document.createElement('div');
  res.className='result';
  res.innerHTML=`<div class="result-eyebrow">${r.eyebrow}</div><div class="result-product">${r.product}</div><div class="result-story">${r.story}</div><div class="example">${r.example}</div><details class="why"><summary>Why not the other tools?</summary><div class="why-body">${r.whyNot}</div></details><div><a class="cta-btn" href="${r.link}" target="_blank" rel="noopener">${r.cta}</a></div><button class="restart" id="restart">Start over</button>`;
  el.appendChild(res);
  res.querySelector('#restart').onclick=()=>renderQuestion('q1');
}

renderQuestion('q1');
</script>
</body>
</html>
